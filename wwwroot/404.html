<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <base href="/albanPortfolio/" />
    <script>
        // Store the full path (pathname + search query) that the user tried to access
        sessionStorage.redirect = location.pathname + location.search;
        // Redirect to the base path of the application (index.html)
        location.replace('/albanPortfolio/');
    </script>
</head>

<body>
    Redirecting to homepage...
</body>

</html>
