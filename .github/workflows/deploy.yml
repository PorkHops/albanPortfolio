name: Deploy to GitHub Pages

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Publish .NET Project
      run: |
        dotnet build
        dotnet publish -c Release -o release --nologo
        # Move contents from nested directory up one level
        mv release/wwwroot/albanPortfolio/* release/wwwroot/
        rm -rf release/wwwroot/albanPortfolio
        ls -la release/wwwroot/

    - name: Change base-tag in index.html
      run: |
        if [ -f "release/wwwroot/index.html" ]; then
          sed -i 's/<base href="\/" \/>/<base href="\/albanPortfolio\/" \/>/g' release/wwwroot/index.html
        else
          echo "index.html not found in release/wwwroot/"
          exit 1
        fi

    - name: Add .nojekyll file
      run: touch release/wwwroot/.nojekyll

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'release/wwwroot'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v3